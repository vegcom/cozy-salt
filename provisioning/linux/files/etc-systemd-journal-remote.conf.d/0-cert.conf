[Remote]
# Optional: Path to TLS certificate and key for secure logging
ServerKeyFile=/etc/systemd/journal-remote-certs/server.key
ServerCertificateFile=/etc/systemd/journal-remote-certs/server.crt
TrustedCertificateFile=/etc/systemd/journal-remote-certs/ca.crt

