# Managed by Salt - DO NOT EDIT MANUALLY

# ====================== Hooks ======================
set-hook -g client-attached '\
    if-shell " " "source-file ~/.tmux.conf" ; \
    if-shell " " "source-file /etc/tmux.conf" ; \
    run-shell "tmux update-environment -g" ; \
    display-message "👍 Config reloaded + environment updated"'

# ====================== Environment ======================
set -g update-environment "\
    #{update-environment} \
    TMUX_SOCKET WINDOWID XAUTHORITY DISPLAY TERM \
    SSH_CLIENT SSH_TTY SSH_AUTH_SOCK SSH_ASKPASS SSH_CONNECTION \
    VSCODE VSCODE_DEBUGPY_ADAPTER_ENDPOINTS VSCODE_IPC_HOOK_CLI \
    VSCODE_GIT_ASKPASS_MAIN VSCODE_GIT_ASKPASS_NODE VSCODE_GIT_IPC_HANDLE \
    __PROXYJUMP_GATE__"

# Binds
unbind C-b
if-shell '[ -n "${SSH_CLIENT}" ] || [ -n "${SSH_CONNECTION}" ]' {
    if-shell '[ "${__PROXYJUMP_GATE__}" -eq 1 ]' {
        set -g prefix 'C-x'
        set -g prefix 'C-a'
    }
    set -g prefix 'C-x'
}
unbind %
unbind *
bind * kill-pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
unbind space
bind x select-layout even-vertical
unbind n
unbind c
bind c new-window
bind K kill-window
unbind ,
unbind .
bind , previous-window
bind . next-window
unbind &
unbind r
bind r if-shell '[ -f ~/.tmux.conf ]' {
    source-file ~/.tmux.conf
    source-file /etc/tmux.conf
}

# Clipboard  handling
if-shell '[ -n "${SSH_CLIENT}" ] || [ -n "${SSH_CONNECTION}" ]' {
    set -s set-clipboard external
    set -s set-clipboard on
}
# Shell defaults to zsh
set -g default-shell /bin/zsh

# Terminal & Colours
set-environment -g COLORTERM "truecolor" # truecolor
set -as terminal-features "xterm-256color:RGB,WT-256color:RGB,alacritty:RGB,screen-256color:RGB"
set -as terminal-overrides ",xterm*:Tc,WT-256color:Tc,*256col*:Tc" # terminal color support
set -ga terminal-overrides "*:Ss=\E[%p1%d q:Se=\E[ q" # cursor handling
set -ga terminal-overrides ',*:cud1=\E[1B' # mouse-utf8 off
set -g default-terminal "tmux-256color" # terminal override

# Cursor & Mouse
set -sa terminal-features ",xterm-256color:usstyle"
set -g mouse on

# Tooling
set -sg escape-time 0

# UI
set -g status on
set -g pane-base-index 1
set -g base-index 1
set -g set-titles on
set -g aggressive-resize on
set -g set-titles-string '#{pane_current_command}'
set -g history-limit 40960
set -g visual-activity on
set -g renumber-windows on
set -g remain-on-exit on
set-window-option -g monitor-activity on

# statusbar
if-shell '[ -n "${SSH_CLIENT}" ] || [ -n "${SSH_CONNECTION}" ]' {
    if-shell '[ "${__PROXYJUMP_GATE__}" -eq 1 ]' {
        set -g status-position 'top'
        set -g status-position 'bottom'
    }
    set -g status-position 'top'
}
# Status bar colors (new style)
set -g status-style 'fg=#e8e8e8,bg=default'

# Left side of status bar
set -g status-left-length 128
set -g status-left "#[fg=#e8e8e8,bg=#44475a] #S #[fg=default,bg=default] "

# Window status
set -g window-status-style 'fg=#e878c0,bg=#44475a'
set -g window-status-current-style 'fg=#58e878,bg=#44475a'
set -g window-status-format "#[fg=#e878c0,bg=#44475a] #I #[fg=#b89ae0,bg=#44475a] #W "
set -g window-status-current-format "#[fg=#44475a,bg=#e0e888] #I #[fg=#58e878,bg=#44475a] #W "
set -g window-status-separator " "
set -g status-justify left

# Right side of status bar
set -g status-right-length 128
set -g status-interval 1
if-shell '[ -n "${SSH_CLIENT}" ] || [  -n "${SSH_CONNECTION}" ]' {
    set -g status-right "#[fg=#58e878,bg=#44475a] • #(host_short) "
    set -g status-right "#[fg=#e8e8e8,bg=#44475a] %Y-%m-%d #[fg=#a0a0a0,bg=#282a36] T%H:%M:%S #[fg=#e8e8e8,bg=#44475a] #(whoami)@#(host_short) "
}
# Pane borders
set -g pane-border-style 'fg=#b89ae0,bg=default'
set -g pane-border-format "#{pane_index} #{pane_current_command}"
set -g pane-active-border-style 'fg=#58e878,bg=default'
# Pane number indicator
set -g display-panes-colour '#e8e8e8'
set -g display-panes-active-colour '#e0e888'

# Pass focus status to applications
set -g focus-events on

# Clock mode
set -g clock-mode-colour '#e878c0'
set -g clock-mode-style 24

# Message styling
set -g message-style 'fg=default,bg=#e85858,align=centre'
set -g message-command-style 'fg=default,bg=#e85858,align=left'
set -g display-time 5000

# Keybind type
setw -g mode-keys vi

# Auto install TPM
if-shell "[ ! -d ~/.tmux/plugins/tpm ]" {
    run 'git clone --recursive https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'
    run "
        export __TPM_before=$(git -C ~/.tmux/plugins/tpm rev-parse HEAD 2>/dev/null)
        git -C ~/.tmux/plugins/tpm fetch 1>/dev/null 2>/dev/null
        export __TPM_after=$(git -C ~/.tmux/plugins/tpm rev-parse HEAD 2>/dev/null)
        if [ $__TPM_before != $__TPM_after ] ; then
            git -C ~/.tmux/plugins/tpm pull 1>/dev/null 2>/dev/null
            ~/.tmux/plugins/tpm/bin/update_plugins all 1>/dev/null 2>/dev/null
        fi
        unset __TPM_before
        unset __TPM_after
        "
}

# Plugins
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @plugin 'tmux-plugins/tpm'
set -g @resurrect-processes ':all:'
set -g @resurrect-hook-post-save-all 'eval $(xdotool getwindowgeometry --shell $WINDOWID); echo -1,$X,$Y,$WIDTH,$HEIGHT > $HOME/.tmux/resurrect/geometry'
set -g @resurrect-hook-pre-restore-all 'wmctrl -i -r $WINDOWID -e $(cat $HOME/.tmux/resurrect/geometry)'
set -g @logging-path "~/scratch/"

# TPM plugins
# https://github.com/tmux-plugins/list
set -g @plugin 'akohlbecker/aw-watcher-tmux'
set -g @plugin 'graemedavidson/tmux-pane-focus'
set -g @plugin 'noscript/tmux-mighty-scroll'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/vim-tmux'
run '~/.tmux/plugins/tpm/tpm'
