name: docker-proxy
services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    command:
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.docker.address=:2376'
      - '--entrypoints.web.address=:5000'
      - '--log.level=DEBUG'
    ports:
      - '2376:2376'
      - '5000:5000'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  socat:
    image: alpine/socat:latest
    container_name: socat
    restart: unless-stopped
    command: >
      tcp-listen:2375,fork,reuseaddr
      unix-connect:/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - 'traefik.enable=true'
      - 'traefik.tcp.routers.docker.rule=HostSNI(`*`)'
      - 'traefik.tcp.routers.docker.entrypoints=docker'
      - 'traefik.tcp.routers.docker.tls=false'
      - 'traefik.tcp.services.docker.loadbalancer.server.port=2375'
  registry:
    image: registry:latest
    container_name: registry
    restart: unless-stopped
    volumes:
      - registry:/var/lib/registry
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.registry.entrypoints=web'
      - 'traefik.http.routers.registry.rule=PathPrefix(`/`)'
      - 'traefik.http.services.registry.loadbalancer.server.port=5000'
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    command: --debug
    environment:
      WATCHTOWER_CLEANUP: 1
      WATCHTOWER_INCLUDE_STOPPED: 1
      WATCHTOWER_LIFECYCLE_HOOKS: 1
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_REVIVE_STOPPED: 1
    restart: unless-stopped
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - /var/run/dbus:/var/run/dbus
    labels:
      - 'cozy.service=registry'
      - 'cozy.role=docker-registry'
      - 'cozy.project=cozy-salt'
volumes:
  registry:
