[Login]
# Make the power button trigger a normal system sleep instead of a full shutdown
HandlePowerKey=suspend
HandlePowerKeyLongPress=ignore

# Ensure sleep/suspend functions drop down to memory state cleanly
HandleSuspendKey=suspend
HandleHibernateKey=ignore

# Keep the session alive if docked to a TV or monitor
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore

# Crucial: Protects background Steam downloads when jumping between sessions
KillUserProcesses=no

# Prevent rogue background apps from blocking your sleep command
PowerKeyIgnoreInhibited=yes
SuspendKeyIgnoreInhibited=yes
