[Slice]
# Restrict background processes from taking absolute CPU priority
CPUWeight=20

# Pins background processes primarily to the first 6 logical cores (0-5)
# This guarantees threads 6 and 7 are wide open for Gamescope UI rendering
AllowedCPUs=0-5

# Cap runaway VRAM/RAM chromium memory leaks from Steam Web Helper
MemoryHigh=4G
MemoryMax=6G

# Priroity
Nice=0
IOWeight=20
