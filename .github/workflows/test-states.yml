name: Test Salt States

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-states:
    name: Test Salt States
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up CI pillar stubs (gitignored files)
        run: |
          cp srv/pillar/common/users.sls.example srv/pillar/common/users.sls
          cp srv/pillar/common/network.sls.example srv/pillar/common/network.sls
          cp srv/pillar/secrets/README.md srv/pillar/secrets/init.sls

      - name: Remove master key bind mounts for CI
        run: |
          # Entrypoint generates fresh keys when none exist — no bind mount needed in CI
          # Bind-mounted files can't be unlinked (EBUSY) even rw, which breaks salt key init
          sed -i '/master\.pem.*salt\/pki\/master\/master\.pem/d' docker-compose.yaml
          sed -i '/master\.pub.*salt\/pki\/master\/master\.pub/d' docker-compose.yaml

      - name: Test Salt states (ubuntu + rhel)
        run: pytest tests/ -m "ubuntu or rhel"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-results
          path: tests/output/*.json
          retention-days: 30
          if-no-files-found: ignore

  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: test-states
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download test results
        id: download
        uses: actions/download-artifact@v4
        with:
          name: state-results
          path: test-results
        continue-on-error: true

      - name: Generate test summary
        run: |
          echo "# Salt State Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for distro in ubuntu rhel; do
            echo "## $distro" >> $GITHUB_STEP_SUMMARY

            json_file=$(find test-results -name "${distro}_*.json" 2>/dev/null | head -1)

            if [ -f "$json_file" ]; then
              python3 tests/parse-state-results.py "$json_file" >> $GITHUB_STEP_SUMMARY 2>&1 || true
            else
              echo "No results found for $distro" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
          done
