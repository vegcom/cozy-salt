[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: integration tests requiring 
    ubuntu: Ubuntu/Debian state tests
    rhel: RHEL/Rocky state tests
    windows: Windows state tests
    integration: integration tests requiring Docker"
addopts = -v --tb=short --strict-markers -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
