extends: default

rules:
  line-length:
    max: 120
    level: warning
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no']
  comments:
    min-spaces-from-content: 1
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  new-lines:
    type: unix
  empty-lines:
    max: 1
    max-start: 0
    max-end: 0

ignore:
  - tests/output/
  - tests/archive-*/
  - .git/
