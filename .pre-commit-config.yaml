# Pre-commit hooks for cozy-salt
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe'] # Allow custom YAML tags (Salt uses Jinja)
        exclude: \.sls$ # Skip .sls files (Jinja templates break YAML parser)
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict

  # Validate SaltStack states
  - repo: https://github.com/warpnet/salt-lint
    rev: v0.9.2
    hooks:
      - id: salt-lint
        files: \.(sls)$

  - repo: local
    hooks:
      - id: trunk-fmt
        name: Trunk Format
        entry: bash -c "trunk fmt --ci --index && trunk check --fix --show-existing --ci --index"
        language: system
        stages: [pre-commit]
        pass_filenames: false

