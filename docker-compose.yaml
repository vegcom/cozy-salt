---
# For McVlan network isolation
# docker compose -f docker-compose.yaml  -f docker-compose-net.yml  config

# YAML Anchors - Common service definitions (HIGH-002)

x-minion-base: &minion-base
  restart: 'no'
  privileged: true
  networks:
    - salt-net
  depends_on:
    salt:
      condition: service_healthy

services:
  salt:
    container_name: salt
    build:
      context: .
      dockerfile: Dockerfile
      target: salt-master
    restart: unless-stopped
    expose:
      - '4505' # Master pub (ZeroMQ)
      - '4506' # Minion ret (ZeroMQ)
      - '5353' # Avahi (MDNS)
      - '3333' # SaltGUI (API interface)
    volumes:
      # Local service discovery
      - /var/run/dbus:/var/run/dbus
      # Salt file roots - use bind mount with subpath
      - ./srv/salt:/srv/salt:ro
      - ./srv/pillar:/srv/pillar:ro
      # Provisioning files - separate mount point
      - ./provisioning:/provisioning:ro
      # Persistent data
      - salt-cache:/var/cache/salt
      - salt-logs:/var/log/salt
      - salt-pki:/etc/salt/pki/master
      # Master keys bind mount (survives rebuilds - volume has minions/*, these overlay master.*)
      - ./srv/salt/keys/master/master.pem:/etc/salt/pki/master/master.pem:ro
      - ./srv/salt/keys/master/master.pub:/etc/salt/pki/master/master.pub:ro
      # Master config (file_roots.conf, auto_accept.conf generated by entrypoint)
      - ./srv/master.d:/etc/salt/master.d
      # Persistent job return data (sqlite3 returner)
      - ./srv/data:/srv/data
      # Avahi
      - ./srv/avahi:/etc/avahi/services
    environment:
      SALT_API_ENABLED: 'True'
      SALT_API_LOG_LEVEL: ${SALT_API_LOG_LEVEL:-warning}
      SALT_API_LOG_FILE_LEVEL: ${SALT_API_LOG_LEVEL:-warning}
      SALT_API_SVC_PASS: ${SALT_API_SVC_PASS:-4wesome-Pass0rd}
      SALT_MASTER_LOG_FILE_LEVEL: ${SALT_MASTER_LOG_FILE_LEVEL:-warning}
      SALT_MASTER_LOG_LEVEL: ${SALT_MASTER_LOG_LEVEL:-warning}
      SALT_MINION_LOG_LEVEL: ${SALT_MINION_LOG_LEVEL:-warning}
      SALT_MINION_LOG_FILE_LEVEL: ${SALT_MINION_LOG_FILE_LEVEL:-warning}
      _GUI_VERSION: 1.34.0
      TZ: ${TZ:-America/New_York}
    networks:
      - salt-net
    labels:
      cozy.service: salt
      cozy.role: salt-master
    hostname: salt

  openobserve:
    container_name: openobserve
    image: public.ecr.aws/zinclabs/openobserve:latest
    restart: unless-stopped
    expose:
      - '5080'
    ports:
      - '5080:5080'  # UI + REST API + OTLP-http ingest
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-admin@cozy.local}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:-changeme}
      ZO_ROOT_USER_TOKEN: ${ZO_ROOT_USER_TOKEN:?set a static root token, e.g. openssl rand -hex 16}
      ZO_DATA_DIR: /data
      TZ: ${TZ:-America/New_York}
    volumes:
      - openobserve-data:/data
    networks:
      - salt-net
    labels:
      cozy.service: openobserve
      cozy.project: cozy-salt

  fluent-bit:
    container_name: fluent-bit
    image: cr.fluentbit.io/fluent/fluent-bit:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/New_York}
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-admin@cozy.local}
      ZO_ROOT_USER_TOKEN: ${ZO_ROOT_USER_TOKEN:?set a static root token, e.g. openssl rand -hex 16}
    volumes:
      - ./srv/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./srv/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ${DOCKER_DATA_PATH:-/var/lib/docker}/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/containers:/var/log/containers:ro
      - /var/log/pods:/var/log/pods:ro

    networks:
      - salt-net
    depends_on:
      - openobserve
    labels:
      cozy.service: fluent-bit
      cozy.project: cozy-salt


  winget-manifest:
    container_name: winget-manifest

    build:
      context: https://github.com/June-Cozy/cozy-winget.git
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      salt:
        condition: service_healthy
    expose:
      - '8080'
    volumes:
      - winget-manifest-data:/data
    environment:
      MANIFEST_REPO_URL: https://github.com/June-Cozy/cozy-winget.git
      MANIFEST_PULL_INTERVAL: '86400'
      MANIFEST_DEBUG: ${MANIFEST_DEBUG:-0}
      TZ: ${TZ:-America/New_York}
    networks:
      - salt-net
    labels:
      cozy.service: winget-manifest
      cozy.role: winget-manifest
      cozy.project: cozy-salt
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    hostname: winget-manifest

  # Ubuntu test minion - auto-applies highstate on startup
  salt-minion-ubuntu:
    container_name: salt-minion-ubuntu-test
    build:
      context: .
      dockerfile: Dockerfile
      target: salt-minion-deb
    environment:
      SALT_MASTER: salt
      MINION_ID: ubuntu-test
      TZ: ${TZ:-America/New_York}
    labels:
      cozy.service: salt-minion
      cozy.dist: ubuntu
      cozy.env: dev
      cozy.role: salt-minion
      cozy.project: cozy-salt
    # Keys are baked into image at build time - no bind mounts needed
    <<: *minion-base
    profiles:
      - test-ubuntu

  # RHEL test minion - auto-applies highstate on startup
  salt-minion-rhel:
    container_name: salt-minion-rhel-test
    build:
      context: .
      dockerfile: Dockerfile
      target: salt-minion-rpm
    environment:
      SALT_MASTER: salt
      MINION_ID: rhel-test
      TZ: ${TZ:-America/New_York}
    labels:
      cozy.service: salt-minion
      cozy.dist: rhel
      cozy.env: dev
      cozy.role: salt-minion
      cozy.project: cozy-salt
    # Keys are baked into image at build time - no bind mounts needed
    <<: *minion-base
    profiles:
      - test-rhel

  # Windows Desktop test minion via Dockur (requires KVM on Linux host)
  # This runs actual Windows 11 Desktop in a VM-like container using QEMU+KVM
  # Auto-enrolls in Salt via Autounattend.xml + FirstLogonCommands
  # Access via web interface at http://localhost:8006 (login: admin/admin123!)
  salt-minion-windows:
    container_name: salt-minion-windows-test
    image: dockurr/windows
    restart: 'no'
    depends_on:
      salt:
        condition: service_healthy
    ports:
      - 8006:8006 # Web VNC interface
      - 3389:3389 # RDP (optional, for direct access)
    volumes:
      - ./scripts:/mnt/scripts:ro # Mount scripts for Salt enrollment
      - ./provisioning/windows/Autounattend.xml:/Autounattend.xml:ro # Unattended install config
    environment:
      VERSION: '11' # Windows 11 Pro
      RAM_SIZE: '4G' # 4GB RAM
      CPU_CORES: '2' # 2 vCPUs
      DISK_SIZE: '64G' # 64GB virtual disk
      MANUAL: 'N' # Unattended install with Autounattend.xml
      TZ: ${TZ:-America/New_York}
    networks:
      - salt-net
    labels:
      cozy.service: salt-minion
      cozy.dist: nt
      cozy.env: dev
      cozy.role: salt-minion
      cozy.project: cozy-salt
    cap_add:
      - NET_ADMIN # Required for network management
    devices:
      - /dev/kvm # Requires KVM support (Linux only)
      - /dev/net/tun # Required for networking
    profiles:
      - test-windows
volumes:
  salt-cache:
  salt-logs:
  salt-pki:
  openobserve-data:
  winget-manifest-data:


networks:
  salt-net:
