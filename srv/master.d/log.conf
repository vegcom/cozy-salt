log_granular_levels:
  'pentelemetry.metrics._internal': 'error'
  'salt.auth': 'error'
  'salt.beacons': 'error'
  'salt.loaded.ext.module.custom_module': 'warning'
  'salt.loaded.ext.states.custom_module': 'warning'
  'salt.loaded.int.cache': 'error'
  'salt.modules': 'error'
  'salt.utils.schedule': 'error'
  'salt': 'info'

log_datefmt_logfile: '%Y-%m-%dT%H:%M:%S'
log_fmt_logfile: 'time=%(asctime)s.%(msecs)03d level=%(levelname)s module=%(name)s line=%(lineno)d pid=%(process)d msg=%(message)s'

log_datefmt: '%Y-%m-%dT%H:%M:%S'
log_fmt_console: '%(asctime)s.%(msecs)03d [%(levelname)-8s] %(message)s'
