# Fast-fail timeout profile — tuned for cozy-salt multi-OS cluster
# See: https://docs.saltproject.io/en/latest/ref/configuration/master.html

# CLI + job return timeouts
timeout: 5
gather_job_timeout: 10
show_timeout: False

# Tornado file-server (default request timeout is 3600s — absurd)
http_connect_timeout: 5
http_request_timeout: 30

# IPC — prevent master hanging on stuck minions
ipc_write_timeout: 5
