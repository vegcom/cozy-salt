# Salt Reactor Configuration
# Watches for events and triggers responses

reactor_refresh_interval: 30
reactor_worker_threads: 8

reactor:
  # Windows health check failure - triggers emergency maintenance
  - 'cozy/windows/health-check/failed':
    - salt://reactor/windows-health-check.sls
  # Network settings changed - collect netinfo, refresh IPFS mine + peer sync
  - 'salt/beacon/*/network_settings/*':
    - salt://reactor/network-changed.sls
    - salt://reactor/ipfs-mine-sync.sls
    - salt://reactor/ipfs-peers.sls
    - salt://reactor/ipfs-publish.sls
  # resolv.conf changed - restore managed DNS config
  - 'salt/beacon/*/file_watch//etc/resolv.conf':
    - salt://reactor/resolv-changed.sls
  # master ready - fired from entrypoint after minions respond
  - 'cozy/master/online':
    - salt://reactor/master-minion-online.sls
  # ipfs content updated - fired from update script after ipfs files cp
  - 'cozy/ipfs/mfs':
    - salt://reactor/ipfs-mfs.sls
  ## presence_events
  # - 'salt/presence/presen':
  #   - salt://reactor/ipfs-peers.sls
