[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   On

[PARSER]
    Name        cri
    Format      regex
    Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<message>.*)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

[PARSER]
    Name        k8s_tag_from_path
    Format      regex
    Regex       ^/var/log/containers/(?<pod_name>[^_]+)_(?<namespace>[^_]+)_(?<container_name>.+)-[0-9a-f]{64}\.log$


[MULTILINE_PARSER]
    Name          salt_multiline
    Type          regex
    Flush_timeout 5000
    Rule          "start_state"  "/^time=/"  "cont"
    Rule          "cont"         "/^(?!time=).*/"  "cont"

[PARSER]
    Name        salt_log
    Format      regex
    Regex       ^time=(?<time>[^ ]+) level=(?<level>[^ ]+) module=(?<module>[^ ]+) line=(?<line>[^ ]+) pid=(?<pid>[^ ]+) msg=(?<msg>[\s\S]*)\n?$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Offset ${TIME_OFFSET}

