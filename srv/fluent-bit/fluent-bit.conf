[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Path_Key          source_path
    Parser            docker
    Tag               docker.*
    Refresh_Interval  5
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

[INPUT]
    Name              tail
    Path              /var/log/containers/*.log
    Path_Key          source_path
    Parser            cri
    Tag               kube.*
    Refresh_Interval  5
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

[FILTER]
    Name           parser
    Match          kube.*
    Key_Name       source_path
    Parser         k8s_tag_from_path
    Reserve_Data   On

[OUTPUT]
    Name             http
    Match            docker.*
    Host             openobserve
    Port             5080
    URI              /api/default/docker_logs/_json
    Format           json
    Json_Date_Key    @timestamp
    Json_Date_Format iso8601
    HTTP_User        ${ZO_ROOT_USER_EMAIL}
    HTTP_Passwd      ${ZO_ROOT_USER_TOKEN}
    tls              Off

[OUTPUT]
    Name             http
    Match            kube.*
    Host             openobserve
    Port             5080
    URI              /api/default/k8s_logs/_json
    Format           json
    Json_Date_Key    @timestamp
    Json_Date_Format iso8601
    HTTP_User        ${ZO_ROOT_USER_EMAIL}
    HTTP_Passwd      ${ZO_ROOT_USER_TOKEN}
    tls              Off
