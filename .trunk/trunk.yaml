---
# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# Further references:
# - https://github.com/trunk-io/plugins/blob/main/linters/plugin.yaml
#   - or per item: linters/*/plugin.yaml
# - https://github.com/desktophero/trunk-docs/blob/main/check/reference/trunk-yaml.md

version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
repo:
  trunk_branch: develop
  use_branch_upstream: true
tools:
  enabled:
    - actionlint@1.7.12
    - bandit@1.9.4
    - checkov@3.3.27
    - dotenv-linter@4.0.0
    - grype@0.119.0
    - hadolint@2.15.1
    - isort@9.0.2
    - markdownlint@0.49.1
    - osv-scanner@2.6.0
    - pinact@5.0.0
    - prettier@3.9.10
    - psscriptanalyzer@1.25.0
    - pylint@4.1.3
    - ruff@0.17.0
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - taplo@0.10.0
    - trufflehog@3.97.9
    - yamllint@1.38.0
lint:
  enabled:
    - actionlint@1.7.12
    - bandit@1.9.4
    - checkov@3.3.27
    - dotenv-linter@4.0.0
    - flake8@7.4.1
    - git-diff-check
    - grype@0.119.0
    - hadolint@2.15.1
    - isort@9.0.2
    - markdownlint@0.49.1
    - osv-scanner@2.6.0
    - pinact@5.0.0
    - prettier@3.9.10
    - pylint@4.1.3
    - ruff@0.17.0
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - taplo@0.10.0
    - trufflehog@3.97.9
    - yamllint@1.38.0

  disabled:
    - black
  ignore:
    - linters: [yamllint]
      paths:
        - .github/workflows/*.yml
    - linters: [pinact]
      paths:
        - .github/workflows/*.yml
    - linters: [markdownlint]
      paths:
        - .github/PULL_REQUEST_TEMPLATE/*.md
        - .github/ISSUE_TEMPLATE/*.md
        - CODE_OF_CONDUCT.md
        - CONTRIBUTING.md
        - SECURITY.md
    - linters: [pylint]
      paths:
        - provisioning/common/dotfiles/.git_template/hooks/*
    - linters: [flake8]
      paths:
        - provisioning/common/dotfiles/.git_template/hooks/*
    - linters: [shfmt]
      paths:
        - .envrc
        - provisioning/common/files/opt-cozy-bin/presence
  definitions:
    - name: shfmt
      commands:
        - name: format
          batch: true
          cache_results: true
          disable_upstream: true
          formatter: true
          in_place: true
          output: shfmt
          run: shfmt --apply-ignore -w -s ${target}
          success_codes: [0, 1]
      tools: [shfmt]
      suggest_if: files_present
      affects_cache: [.editorconfig]
      version_command:
        parse_regex: ${semver}
        run: shfmt --version
    - name: osv-scanner
      files: [lockfile]
      tools: [osv-scanner]
      description: Checks for known vulnerabilities in your dependencies
      commands:
        - name: scan
          output: sarif
          run: osv-scanner --config=${workspace}/osv-scanner.toml --format=json --lockfile=${target}
          success_codes: [0, 1, 128]
          read_output_from: stdout
          is_security: true
actions:
  disabled:
    - trunk-announce
  enabled:
    - git-lfs
    - trunk-check-pre-commit
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
